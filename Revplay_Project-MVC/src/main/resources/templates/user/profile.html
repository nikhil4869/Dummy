<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevPlay - Profile</title>
    <link rel="stylesheet" th:href="@{/css/user-style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="dark-theme">
    <div class="layout-container">
        <div th:replace="~{fragments/user-sidebar :: userSidebar('profile')}"></div>
        <main class="main-content">
            <div class="content-scroll">
                <h1 class="page-title">User Profile</h1>
                <div class="profile-container">
                    <div class="profile-header-view">
                        <div class="profile-avatar-large">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="profile-info-large">
                            <h2 class="profile-name-large" th:text="${profile != null ? profile.name : 'User Name'}">
                                User Name</h2>
                            <p class="profile-email-large"
                                th:text="${profile != null ? profile.email : 'user@example.com'}">user@example.com</p>
                            <p class="profile-bio-large"
                                th:text="${profile != null ? profile.bio : 'No bio available.'}">User bio goes here...
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/global-player :: globalPlayer}"></div>
</body>

</html>
